<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Stability Analyzer</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --color-online: #10b981;
            --color-offline: #f43f5e;
            --color-idle: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .input-container {
            margin-bottom: 1.5rem;
        }

        .input-container input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .input-container input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .status-container {
            background-color: #0f172a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .target-url {
            font-family: monospace;
            color: var(--accent-color);
            font-size: 0.95rem;
            background: rgba(99, 102, 241, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            word-break: break-all;
            max-width: 100%;
        }

        .status-badge {
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.35rem 1rem;
            border-radius: 9999px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .badge-idle { background-color: rgba(100, 116, 139, 0.2); color: var(--color-idle); }
        .badge-loading { background-color: rgba(234, 179, 8, 0.2); color: #eab308; animation: pulse 1.5s infinite; }
        .badge-online { background-color: rgba(16, 185, 129, 0.2); color: var(--color-online); }
        .badge-offline { background-color: rgba(244, 63, 94, 0.2); color: var(--color-offline); }

        .status-text {
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-action:hover { background-color: var(--accent-hover); }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { background-color: #475569; cursor: not-allowed; transform: none; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>Network Monitor</h1>
        <p class="subtitle">Enter a website URL to test its connectivity</p>

        <div class="input-container">
            <input type="text" id="url-input" placeholder="Ex: google.com or github.com" value="google.com">
        </div>

        <div class="status-container">
            <span id="display-url" class="target-url">No target set</span>
            <span id="status-badge" class="status-badge badge-idle">Idle</span>
            <p id="status-text" class="status-text">Click the button to start the test.</p>
        </div>

        <button id="btn-check" class="btn-action" onclick="checkSite()">Analyze Address</button>
    </div>

    <script>
        async function checkSite() {
            const urlInputValue = document.getElementById('url-input').value.trim();
            const btn = document.getElementById('btn-check');
            const statusText = document.getElementById('status-text');
            const badge = document.getElementById('status-badge');
            const displayUrl = document.getElementById('display-url');

            if (!urlInputValue) {
                statusText.innerText = "Please enter an address first.";
                badge.className = "status-badge badge-offline";
                badge.innerText = "Error";
                return;
            }

            displayUrl.innerText = urlInputValue;
            btn.disabled = true;
            statusText.innerText = "Attempting to connect...";
            badge.className = "status-badge badge-loading";
            badge.innerText = "Analyzing...";

            try {
                const response = await fetch(`/check?url=${encodeURIComponent(urlInputValue)}`);
                const data = await response.json();
                
                if (data.online) {
                    statusText.innerText = "Connection successful! The site is responding.";
                    badge.className = "status-badge badge-online";
                    badge.innerText = "Online";
                } else {
                    statusText.innerText = "Unable to reach the address (Timeout).";
                    badge.className = "status-badge badge-offline";
                    badge.innerText = "Offline";
                }
            } catch (error) {
                statusText.innerText = "Communication error with the local server.";
                badge.className = "status-badge badge-offline";
                badge.innerText = "Error";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
